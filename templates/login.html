{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<main class="auth-panel">
    <span class="eyebrow d-block text-center">Welcome back</span>
    <h1>Log in</h1>
    <p>Sign in to join the conversation and manage your account.</p>
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-warning">Log in</button>
    </form>
</main>
{% endblock %}
